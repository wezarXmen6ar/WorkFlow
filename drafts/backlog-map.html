/* ============================== RENDER ================================== */
(function(){
var gr=document.getElementById("gr"),svg=document.getElementById("lk"),dt=document.getElementById("dt"),sum=document.getElementById("sum");
var T={},up={},dn={},home={},kids={},LK={},nd={},cols=[],pin=null,PATH={};
var MK={"new":"NEW","amended":"AMENDED","cut":"CUT"},MC={"new":"mk-new","amended":"mk-amd","cut":"mk-cut"};

DATA.nodes.forEach(function(n){T[n.id]=n});
var LINKS=DATA.links.filter(function(e){return T[e[0]]&&T[e[1]]});
LINKS.forEach(function(e){
(up[e[0]]=up[e[0]]||[]).push(e[1]);(dn[e[1]]=dn[e[1]]||[]).push(e[0]);LK[e[0]+"|"+e[1]]=e;
if(e[2]){home[e[0]]=e[1];(kids[e[1]]=kids[e[1]]||[]).push(e[0])}});

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function mark(id){var m=T[id].mark;return MK[m]?m:""}
/* "nw" = new link; "rp" = new link between two items that already existed */
function kind(e){if(e[3]!=="new")return "";return mark(e[0])!=="new"&&mark(e[1])!=="new"?"rp":"nw"}
function label(k){var l=DATA.layers.filter(function(x){return x.key===k})[0];return l?l.name.replace(/s$/,""):k}

document.getElementById("ttl").textContent=DATA.version;
document.title=DATA.version+" · map";
var shared=DATA.nodes.filter(function(n){return(up[n.id]||[]).length>1}).length;
var cnt={"new":0,"amended":0,"cut":0},nl=0,rp=0;
DATA.nodes.forEach(function(n){if(mark(n.id))cnt[n.mark]++});
LINKS.forEach(function(e){var k=kind(e);if(k)nl++;if(k==="rp")rp++});
var marked=cnt["new"]+cnt.amended+cnt.cut+nl>0;
var nbuilt=DATA.nodes.filter(function(n){return n.built}).length;
document.getElementById("mta").textContent=[DATA.note,DATA.nodes.length+" items",LINKS.length+" links",shared+" serve more than one parent"].filter(Boolean).join("  ·  ");

/* legend */
var h="";
DATA.layers.forEach(function(l){h+='<span class="kk '+l.tone+'">'+esc(label(l.key))+"</span>"});
h+='<span class="sp"></span><span>Solid line: home parent</span><span class="sp"></span><span>Dashed: also serves</span><span class="sp"></span><span>Badge: number of parents</span>';
if(nbuilt)h+='<span class="sp"></span><span class="key"><span class="ok">\u2713</span>built</span>';
if(marked){h+='<span class="sp"></span>';
if(cnt["new"])h+='<span class="key"><b class="mk-new">NEW</b>not pushed yet</span>';
if(cnt.amended)h+='<span class="key"><b class="mk-amd">AMENDED</b>changed</span>';
if(cnt.cut)h+='<span class="key"><b class="mk-cut">CUT</b>retired</span>';
if(nl-rp)h+='<span class="key"><i class="nw"></i>new link</span>';
if(rp)h+='<span class="key"><i class="rp"></i>new link between existing items</span>'}
h+='<span class="sp"></span><span>Hover to trace, click to pin, Esc to clear</span>';
document.getElementById("lgd").innerHTML=h;

/* columns and nodes */
gr.style.gridTemplateColumns="repeat("+DATA.layers.length+",minmax(0,200px))";
DATA.layers.forEach(function(l){
var c=document.createElement("div");c.className="col";
var ch=document.createElement("div");ch.className="ch";ch.textContent=l.name;c.appendChild(ch);
var ar=document.createElement("div");ar.className="area";c.appendChild(ar);
var ids=[];
DATA.nodes.filter(function(n){return n.layer===l.key}).forEach(function(n){
var p=(up[n.id]||[]).length,m=mark(n.id),b=document.createElement("button");
b.type="button";b.className="nd "+l.tone+(p>1?" b":"")+(m?" "+MC[m]:"");b.dataset.id=n.id;
b.title=(n.ref?n.ref+" — ":"")+n.full+(n.built?" (built)":"");
var lb=document.createElement("span");lb.className="lb";lb.textContent=n.short||n.full;b.appendChild(lb);
if(m){var tg=document.createElement("span");tg.className="tg "+MC[m];tg.textContent=MK[m]+" · "+label(l.key);b.appendChild(tg)}
if(n.built){var ok=document.createElement("span");ok.className="ok";ok.textContent="\u2713";ok.setAttribute("aria-label","built");lb.appendChild(ok)}
if(n.since){var vr=document.createElement("span");vr.className="ver";vr.textContent=n.since;vr.title="First pushed in "+n.since;lb.appendChild(vr)}
if(p>1){var s=document.createElement("span");s.className="bg";s.textContent=p;b.appendChild(s)}
ar.appendChild(b);nd[n.id]=b;ids.push(n.id)});
cols.push({area:ar,ids:ids});
gr.appendChild(c)});

/* layout: every child sits next to its home parent, every parent is centred on its children */
var GAP=14,narrow=window.matchMedia("(max-width:860px)");
function layout(){
var Hh={},Y={};
if(narrow.matches){cols.forEach(function(c){c.area.style.height="";c.ids.forEach(function(k){nd[k].style.top=""})});return}
Object.keys(nd).forEach(function(k){Hh[k]=nd[k].offsetHeight});
cols.forEach(function(c){var y=0;c.ids.forEach(function(k){Y[k]=y+Hh[k]/2;y+=Hh[k]+GAP})});
function place(ids,want){
/* closest positions to the wanted centres, keeping order and spacing (pool adjacent violators) */
var bl=[],off=0,offs=[];
ids.forEach(function(k,i){offs.push(off);bl.push({s:i,e:i,sum:want(k)-Hh[k]/2-off,n:1});off+=Hh[k]+GAP;
while(bl.length>1){var b=bl[bl.length-1],a=bl[bl.length-2];if(a.sum/a.n>b.sum/b.n){a.e=b.e;a.sum+=b.sum;a.n+=b.n;bl.pop()}else break}});
bl.forEach(function(b){var t=b.sum/b.n;for(var i=b.s;i<=b.e;i++){var k=ids[i];Y[k]=t+offs[i]+Hh[k]/2}})}
for(var it=0;it<8;it++){
for(var c=1;c<cols.length;c++)place(cols[c].ids,function(k){var p=home[k];return p!=null&&Y[p]!=null?Y[p]:Y[k]});
for(var c2=cols.length-2;c2>=0;c2--)place(cols[c2].ids,function(k){var ch=(kids[k]||[]).filter(function(x){return Y[x]!=null});if(!ch.length)return Y[k];var s=0;ch.forEach(function(x){s+=Y[x]});return s/ch.length})}
var top=Infinity,bot=0;
Object.keys(Y).forEach(function(k){top=Math.min(top,Y[k]-Hh[k]/2)});
if(top===Infinity)top=0;
Object.keys(Y).forEach(function(k){var t=Y[k]-Hh[k]/2-top;nd[k].style.top=t+"px";bot=Math.max(bot,t+Hh[k])});
cols.forEach(function(c){c.area.style.height=bot+"px"})}

/* links, fanned along each node's edge instead of pinched into one point */
function draw(){
var gb=gr.getBoundingClientRect(),R={};
svg.setAttribute("width",gb.width);svg.setAttribute("height",gb.height);
svg.setAttribute("viewBox","0 0 "+gb.width+" "+gb.height);
Object.keys(nd).forEach(function(k){var r=nd[k].getBoundingClientRect();
R[k]={l:r.left-gb.left,r:r.right-gb.left,h:r.height,c:r.top-gb.top+r.height/2}});
var asP={},asC={},AR={},AL={};
LINKS.forEach(function(e){(asP[e[1]]=asP[e[1]]||[]).push(e);(asC[e[0]]=asC[e[0]]||[]).push(e)});
function fan(list,node,end,out){
list.sort(function(a,b){return R[a[end]].c-R[b[end]].c});
var n=list.length,span=Math.max(0,Math.min(R[node].h-14,(n-1)*9)),y0=R[node].c-span/2;
list.forEach(function(e,i){out[e[0]+"|"+e[1]]=n<2?R[node].c:y0+span/(n-1)*i})}
Object.keys(asP).forEach(function(k){fan(asP[k],k,0,AR)});
Object.keys(asC).forEach(function(k){fan(asC[k],k,1,AL)});
var s=["","",""];PATH={};
LINKS.forEach(function(e){
var key=e[0]+"|"+e[1],x1=R[e[1]].r,y1=AR[key],x2=R[e[0]].l,y2=AL[key];
var sb=Math.min(18,(x2-x1)*.22),a=x1+sb,b=x2-sb,m=(b-a)*.5;
var d="M"+x1+" "+y1+"L"+a+" "+y1+"C"+(a+m)+" "+y1+" "+(b-m)+" "+y2+" "+b+" "+y2+"L"+x2+" "+y2;
PATH[key]=d;var k=kind(e);
s[k==="rp"?2:k?1:0]+='<path class="e'+(e[2]?"":" d")+(k?" "+k:"")+'" d="'+d+'"/>'});
svg.innerHTML='<g>'+s.join("")+'</g><g id="hg"></g>'}

function chain(id){var set={};set[id]=1;
(function w(k,m){(m[k]||[]).forEach(function(v){if(!set[v]){set[v]=1;w(v,m)}})})(id,up);
(function w(k,m){(m[k]||[]).forEach(function(v){if(!set[v]){set[v]=1;w(v,m)}})})(id,dn);
return set}

function nm(x){var n=T[x];return esc(n.full)+(n.ref?' <span class="rf">'+esc(n.ref)+"</span>":"")}
function note(c,p){var e=LK[c+"|"+p],k=kind(e);return k?" <i>(new "+(e[2]?"home":"also-serves")+" link"+(k==="rp"?", between existing items":"")+")</i>":""}
function info(id){var n=T[id],m=mark(id),ps=(up[id]||[]).slice(),cs=dn[id]||[];
ps.sort(function(a,b){return LK[id+"|"+b][2]-LK[id+"|"+a][2]});
var h='<span class="ttl"><b>'+esc(label(n.layer))+(n.ref?" "+esc(n.ref):"")+"</b> — "+esc(n.full)+(n.built?'<span class="ok">\u2713 built</span>':"")+(m?'<span class="tg in '+MC[m]+'">'+MK[m]+"</span>":"")+"</span>";
if(n.hist)h+='<span class="hist">'+esc(n.hist)+"</span>";
if(ps.length)h+='<span class="sv">Serves '+ps.length+": "+ps.map(function(x){return nm(x)+note(id,x)}).join("  ·  ")+"</span>";
if(cs.length)h+='<span class="sv">Served by '+cs.length+": "+cs.map(function(x){return nm(x)+note(x,id)}).join("  ·  ")+"</span>";
return h}

var DEF=DATA.nodes.length?'<span class="st">'+DATA.nodes.length+" items, "+LINKS.length+' links. <b>'+shared+" of them serve more than one parent</b> and carry a badge."+
(marked?" Marked: "+[cnt["new"]+" new",cnt.amended+" amended",cnt.cut+" cut",nl+" new links"].join(", ")+".":"")+"</span>"
:'<span class="st">Nothing here yet. Add entries to the text, then run <b>python workflow/tool.py build</b>.</span>';

function focus(id){
var hg=document.getElementById("hg");
if(!id){gr.classList.remove("on");dt.innerHTML=DEF;if(hg)hg.innerHTML="";return}
var set=chain(id);gr.classList.add("on");
Object.keys(nd).forEach(function(k){nd[k].classList.toggle("hi",!!set[k])});
/* every casing first, then every line, so highlighted links read clearly where they cross */
var cas="",ln="";
LINKS.forEach(function(e){
if(!(set[e[0]]&&set[e[1]]))return;
var d=PATH[e[0]+"|"+e[1]];if(!d)return;
cas+='<path class="hc" d="'+d+'"/>';
ln+='<path class="hl'+(e[2]?"":" d")+'" d="'+d+'"/>'});
hg.innerHTML=cas+ln;
dt.innerHTML=info(id)}

/* written breakdown of what this draft or version changes */
if(marked){
var by={},am=[],ct=[],hl=[],al=[],bx=[];
DATA.nodes.forEach(function(n){var m=mark(n.id),t=label(n.layer);
if(m==="new")(by[t]=by[t]||[]).push(esc(n.full));
if(m==="amended")am.push(nm(n.id));
if(m==="cut")ct.push(nm(n.id))});
LINKS.forEach(function(e){var k=kind(e);if(!k)return;var t=esc(T[e[0]].short||T[e[0]].full)+" → "+esc(T[e[1]].short||T[e[1]].full);
(e[2]?hl:al).push(t);if(k==="rp")bx.push(t)});
function li(t,a){return "<li><b>"+t+" ("+a.length+"):</b> "+(a.length?a.join(", "):'<span class="no">none</span>')+"</li>"}
var sh="<h2>What this map changes</h2><ul>";
DATA.layers.forEach(function(l){var t=label(l.key);if(by[t])sh+=li("New "+t.toLowerCase()+(by[t].length>1?"s":""),by[t])});
if(!cnt["new"])sh+=li("New items",[]);
sh+=li("Amended",am)+li("Cut",ct)+li("New home-parent links",hl)+li("New also-serves links",al)+li("New links between items that already existed",bx)+"</ul>";
sum.innerHTML=sh;sum.hidden=false}

Object.keys(nd).forEach(function(k){var b=nd[k];
b.addEventListener("mouseenter",function(){if(!pin)focus(k)});
b.addEventListener("mouseleave",function(){if(!pin)focus(null)});
b.addEventListener("focus",function(){if(!pin)focus(k)});
b.addEventListener("click",function(){
if(pin===k){pin=null;b.classList.remove("pin");focus(null)}
else{if(pin)nd[pin].classList.remove("pin");pin=k;b.classList.add("pin");focus(k)}})});

document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&pin){nd[pin].classList.remove("pin");pin=null;focus(null)}});

function redraw(){layout();draw();if(pin)focus(pin)}

if(marked){
var ALL=LINKS.slice(),only=false,tog=document.createElement("button");
tog.type="button";tog.className="tog";tog.setAttribute("aria-pressed","false");tog.textContent="Show only changes";
var lg=document.getElementById("lgd");lg.appendChild(document.createElement("span")).className="sp";lg.appendChild(tog);
function changed(){var set={},st=[];
DATA.nodes.forEach(function(n){if(mark(n.id))st.push(n.id)});
ALL.forEach(function(e){if(kind(e)){st.push(e[0]);st.push(e[1])}});
while(st.length){var k=st.pop();if(set[k])continue;set[k]=1;(up[k]||[]).forEach(function(p){st.push(p)})}
return set}
tog.addEventListener("click",function(){
only=!only;tog.setAttribute("aria-pressed",only?"true":"false");tog.textContent=only?"Show the whole plan":"Show only changes";
var keep=only?changed():null;
if(pin&&keep&&!keep[pin]){nd[pin].classList.remove("pin");pin=null;focus(null)}
Object.keys(nd).forEach(function(k){nd[k].classList.toggle("gone",!!keep&&!keep[k])});
cols.forEach(function(c){c.all=c.all||c.ids.slice();c.ids=c.all.filter(function(k){return !keep||keep[k]})});
LINKS=ALL.filter(function(e){return !keep||(keep[e[0]]&&keep[e[1]])});
redraw()})}
dt.innerHTML=DEF;redraw();
var lastW=gr.offsetWidth;
function onResize(){var w=gr.offsetWidth;if(w!==lastW){lastW=w;redraw()}}
if(window.ResizeObserver)new ResizeObserver(onResize).observe(gr);
window.addEventListener("resize",onResize);
if(narrow.addEventListener)narrow.addEventListener("change",redraw);
})();
