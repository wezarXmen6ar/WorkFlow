<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkFlow map</title>
<style>
:root{
--bg:oklch(0.985 0.002 265);--s0:oklch(0.965 0.004 265);--s1:oklch(1 0 0);--s2:oklch(0.975 0.003 265);
--ink:oklch(0.24 0.012 265);--ink2:oklch(0.48 0.012 265);
--line:oklch(0.90 0.006 265);--line2:oklch(0.79 0.010 265);
--t1bg:oklch(0.950 0.030 285);--t1tx:oklch(0.42 0.140 285);--t1ln:oklch(0.79 0.070 285);
--t2bg:oklch(0.955 0.028 25);--t2tx:oklch(0.47 0.150 25);--t2ln:oklch(0.82 0.075 25);
--t3bg:oklch(0.955 0.032 168);--t3tx:oklch(0.41 0.100 168);--t3ln:oklch(0.79 0.060 168);
--t4bg:oklch(0.975 0.003 265);--t4tx:oklch(0.42 0.010 265);--t4ln:oklch(0.79 0.010 265);
--t5bg:oklch(0.955 0.040 75);--t5tx:oklch(0.44 0.100 75);--t5ln:oklch(0.80 0.070 75);
--focus:oklch(0.47 0.200 268);
--radius:8px;
--ease:cubic-bezier(0.22,1,0.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:oklch(0.185 0.008 265);--s0:oklch(0.155 0.008 265);--s1:oklch(0.235 0.010 265);--s2:oklch(0.275 0.010 265);
--ink:oklch(0.955 0.004 265);--ink2:oklch(0.725 0.008 265);
--line:oklch(0.325 0.010 265);--line2:oklch(0.450 0.012 265);
--t1bg:oklch(0.300 0.065 285);--t1tx:oklch(0.865 0.075 285);--t1ln:oklch(0.480 0.100 285);
--t2bg:oklch(0.305 0.065 25);--t2tx:oklch(0.870 0.070 25);--t2ln:oklch(0.500 0.110 25);
--t3bg:oklch(0.290 0.055 168);--t3tx:oklch(0.865 0.080 168);--t3ln:oklch(0.470 0.080 168);
--t4bg:oklch(0.275 0.010 265);--t4tx:oklch(0.800 0.008 265);--t4ln:oklch(0.450 0.012 265);
--t5bg:oklch(0.300 0.055 75);--t5tx:oklch(0.880 0.080 75);--t5ln:oklch(0.500 0.090 75);
--focus:oklch(0.87 0.140 250);
}}
:root[data-theme="dark"]{
--bg:oklch(0.185 0.008 265);--s0:oklch(0.155 0.008 265);--s1:oklch(0.235 0.010 265);--s2:oklch(0.275 0.010 265);
--ink:oklch(0.955 0.004 265);--ink2:oklch(0.725 0.008 265);
--line:oklch(0.325 0.010 265);--line2:oklch(0.450 0.012 265);
--t1bg:oklch(0.300 0.065 285);--t1tx:oklch(0.865 0.075 285);--t1ln:oklch(0.480 0.100 285);
--t2bg:oklch(0.305 0.065 25);--t2tx:oklch(0.870 0.070 25);--t2ln:oklch(0.500 0.110 25);
--t3bg:oklch(0.290 0.055 168);--t3tx:oklch(0.865 0.080 168);--t3ln:oklch(0.470 0.080 168);
--t4bg:oklch(0.275 0.010 265);--t4tx:oklch(0.800 0.008 265);--t4ln:oklch(0.450 0.012 265);
--t5bg:oklch(0.300 0.055 75);--t5tx:oklch(0.880 0.080 75);--t5ln:oklch(0.500 0.090 75);
--focus:oklch(0.87 0.140 250);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1220px;margin:0 auto;padding:28px 24px 40px}
h1{margin:0;font-size:1.25rem;font-weight:500;letter-spacing:-0.01em}
.meta{margin:4px 0 0;font-size:0.8125rem;color:var(--ink2)}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:20px 0 14px;font-size:0.8125rem;color:var(--ink2)}
.kk{display:inline-block;padding:2px 9px;border-radius:var(--radius);font-size:0.8125rem;border:1px solid}
.sp{width:1px;height:14px;background:var(--line2)}
.gr{position:relative;display:grid;gap:0 32px;justify-content:space-between}
.lk{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.e{fill:none;stroke:var(--line2);stroke-width:1.1;opacity:.5;transition:opacity .18s var(--ease)}
.e.d{stroke-dasharray:4 4}
.gr.on .e{opacity:.07}
.hc{fill:none;stroke:var(--bg);stroke-width:7;stroke-linecap:round}
.hl{fill:none;stroke:var(--focus);stroke-width:2.4;stroke-linecap:round}
.hl.d{stroke-dasharray:6 4}
.hd{fill:var(--focus)}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;position:relative;z-index:1;min-width:0}
.ch{font-size:0.75rem;font-weight:500;color:var(--ink2);padding-bottom:5px;border-bottom:1px solid var(--line)}
.nd{position:relative;display:block;width:100%;text-align:left;font:inherit;font-size:0.8125rem;line-height:1.35;padding:9px 11px;border-radius:var(--radius);border:1px solid;cursor:pointer;transition:opacity .18s var(--ease),box-shadow .18s var(--ease)}
.nd.b{padding-right:26px}
.gr.on .nd{opacity:.26}
.gr.on .nd.hi{opacity:1}
.nd.pin{box-shadow:0 0 0 2px var(--focus)}
.nd:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.t1{background:var(--t1bg);color:var(--t1tx);border-color:var(--t1ln)}
.t2{background:var(--t2bg);color:var(--t2tx);border-color:var(--t2ln)}
.t3{background:var(--t3bg);color:var(--t3tx);border-color:var(--t3ln)}
.t4{background:var(--t4bg);color:var(--t4tx);border-color:var(--t4ln)}
.t5{background:var(--t5bg);color:var(--t5tx);border-color:var(--t5ln)}
.bg{position:absolute;top:7px;right:7px;width:17px;height:17px;border-radius:50%;font-size:0.6875rem;line-height:16px;text-align:center;background:var(--bg);border:1px solid currentColor}
.dt{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);min-height:64px;font-size:0.875rem}
.dt .ttl{display:block;margin-bottom:5px}
.dt .sv{display:block;font-size:0.8125rem;color:var(--ink2);margin-top:2px}
.dt .st{color:var(--ink2)}
.dt b{font-weight:500}
noscript{display:block;margin:20px 0;color:var(--ink2)}
@media (max-width:860px){.gr{grid-template-columns:1fr !important;gap:20px}.lk{display:none}.col{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.e,.nd{transition:none}}
@media print{.gr.on .e,.gr.on .nd{opacity:1}.nd.pin{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1 id="ttl">WorkFlow map</h1>
<p class="meta" id="mta"></p>
</header>
<div class="lg" id="lgd"></div>
<noscript>This map needs JavaScript to draw the links between items.</noscript>
<div class="gr" id="gr"><svg class="lk" id="lk" aria-hidden="true"></svg></div>
<div class="dt" id="dt"></div>
</div>

<script>
/* ===========================================================================
   TEMPLATE — to make the map for a new push, copy this file and replace only
   the DATA object below. Nothing under "RENDER" needs to change.

     layers : the columns, left to right. tone t1..t5 picks the colour.
     nodes  : id, layer key, short label (2-4 words), full title.
     links  : [child, parent, 1 = home parent (solid) | 0 = also serves (dashed)]

   Every node needs exactly one home-parent link. Extra links are "also serves".
   =========================================================================== */

var DATA={
version:"Draft v1.0",
note:"Deferred — pending after v0.1. Create and manage projects and Project manager home dashboard are defined in draft-v0.1.md; Landing page and its features are mirrored from draft-v0.1.md; Resource assignment and workload tracking and Phase progress reporting (cut from v0.1’s narrowed scope) are defined here in full",
layers:[
{key:"o",name:"Objectives",tone:"t1"},
{key:"p",name:"Problems",tone:"t2"},
{key:"s",name:"Solutions",tone:"t3"},
{key:"u",name:"Sub-solutions",tone:"t4"},
{key:"f",name:"Features",tone:"t5"}
],
nodes:[
{id:"o1",layer:"o",short:"All projects in one place",full:"Manage all department projects in one place"},
{id:"o2",layer:"o",short:"Accurate status to stakeholders",full:"Present accurate project status to stakeholders"},
{id:"o3",layer:"o",short:"Everything documented",full:"Document everything about each project"},
{id:"o4",layer:"o",short:"Protect the team from pressure",full:"Protect the team from scope creep and project pressure"},

{id:"p8",layer:"p",short:"No tool to create projects",full:"No tool to create and manage projects"},
{id:"p1",layer:"p",short:"No department-wide view",full:"No department-wide view of all projects"},
{id:"p2",layer:"p",short:"Who is working on what",full:"Hard to see what each team member is working on"},
{id:"p3",layer:"p",short:"No single source of truth",full:"No single source of truth for project status"},
{id:"p10",layer:"p",short:"Stakeholders see too much",full:"Stakeholders can't be shown only what concerns them"},
{id:"p4",layer:"p",short:"Files depend on the PM",full:"Project files and context depend on each project manager"},
{id:"p9",layer:"p",short:"No history log",full:"No history log for projects"},
{id:"p5",layer:"p",short:"Requirements added, no cost",full:"Requirements keep being added with no visible cost"},
{id:"p6",layer:"p",short:"Pile-up is not seen",full:"Stakeholders don't see the pile-up of concurrent projects"},
{id:"p7",layer:"p",short:"Priority shifts look free",full:"The cost of priority shifts is invisible"},

{id:"s9",layer:"s",short:"Create and manage",full:"Create and manage projects"},
{id:"s12",layer:"s",short:"PM home dashboard",full:"Project manager home dashboard"},
{id:"s13",layer:"s",short:"Landing page",full:"Landing page"},
{id:"s1",layer:"s",short:"Portfolio view",full:"Department portfolio view"},
{id:"s2",layer:"s",short:"Resource assignment",full:"Resource assignment and workload tracking"},
{id:"s3",layer:"s",short:"Phase progress",full:"Phase progress reporting"},
{id:"s4",layer:"s",short:"Status timeline",full:"Live project status timeline"},
{id:"s11",layer:"s",short:"Stakeholder view",full:"Stakeholder view: only what concerns them"},
{id:"s5",layer:"s",short:"File repository",full:"Central project file repository"},
{id:"s10",layer:"s",short:"History log",full:"Project history log"},
{id:"s6",layer:"s",short:"Requirement impact",full:"Show the impact of new requirements before work starts"},
{id:"s7",layer:"s",short:"Workload indicator",full:"Workload indicator on the department-wide view"},
{id:"s8",layer:"s",short:"Price of a change",full:"Show the price of a change across all projects before it is confirmed"},

{id:"u27",layer:"u",short:"Duplicate project",full:"Duplicate a project"},
{id:"u28",layer:"u",short:"Archive & hard delete",full:"Archive and permanent delete"},
{id:"u25",layer:"u",short:"Personal task list",full:"Personal task list"},
{id:"u1",layer:"u",short:"Yearly plan by quarter",full:"Yearly plan by quarter"},
{id:"u9",layer:"u",short:"Excel import",full:"Import existing Excel data"},
{id:"u29",layer:"u",short:"Search & filter list",full:"Search and filter the project list"},
{id:"u20",layer:"u",short:"Leave and absences",full:"Leave and absences"},
{id:"u22",layer:"u",short:"Person view",full:"Person view"},
{id:"u4",layer:"u",short:"Access by role",full:"Access by role and owning general department"},
{id:"u10",layer:"u",short:"Jira link",full:"Jira link for deployment and security testing"},
{id:"u18",layer:"u",short:"Project health",full:"Project health, quiet by default"},
{id:"u24",layer:"u",short:"Life span",full:"Project's life span"},
{id:"u23",layer:"u",short:"Shared or internal",full:"Shared or internal, per item"},
{id:"u15",layer:"u",short:"Second PM, takeover",full:"Second project manager and takeover"},
{id:"u16",layer:"u",short:"Meeting records",full:"Meeting records"},
{id:"u17",layer:"u",short:"Attach documents",full:"Attach documents to projects and phases"},
{id:"u5",layer:"u",short:"Log requirement days",full:"Log a new requirement with its estimated development days"},
{id:"u6",layer:"u",short:"Highlight the impact",full:"Highlight the impact, on the project timeline and the department-wide view"},
{id:"u14",layer:"u",short:"Original vs current plan",full:"Original plan vs current plan"},
{id:"u19",layer:"u",short:"Capacity check in plan",full:"Capacity check in the yearly plan"},
{id:"u7",layer:"u",short:"Pull and delay calculation",full:"Automatic pull and delay calculation"},
{id:"u8",layer:"u",short:"Confirm before applying",full:"Price shown, confirm before applying"},
{id:"u13",layer:"u",short:"Decision log",full:"Decision log"},
{id:"u21",layer:"u",short:"Project priority",full:"Project priority"},
{id:"u2",layer:"u",short:"Resource pool",full:"Resource pool"},
{id:"u12",layer:"u",short:"Assign to phases",full:"Assign resources to phases"},
{id:"u11",layer:"u",short:"PM approves progress",full:"Project manager approval of progress"},

{id:"f1",layer:"f",short:"Identify by role",full:"Identify the visitor by role"},
{id:"f2",layer:"f",short:"Route PM to dashboard",full:"Route project manager to their dashboard"},
{id:"f3",layer:"f",short:"Placeholder, other roles",full:"Placeholder for other roles"}
],
links:[
["p1","o1",1],["p2","o1",1],["p2","o4",0],["p3","o2",1],
["p3","o1",0],["p4","o3",1],["p5","o4",1],["p6","o4",1],
["p6","o2",0],["p7","o4",1],["s1","p1",1],["s1","p6",0],
["s2","p2",1],["s2","p6",0],["s2","p7",0],["s3","p2",1],
["s3","p3",0],["s4","p3",1],["s4","p5",0],["s5","p4",1],
["s6","p5",1],["s7","p6",1],["s8","p7",1],["s8","p5",0],
["s8","p6",0],["u1","s1",1],["u4","s4",1],["u4","s1",0],
["u4","s7",0],["u5","s6",1],["u6","s6",1],["u6","s8",0],
["u7","s8",1],["u8","s8",1],["u8","s6",0],["u9","s1",1],
["u10","s4",1],["p8","o1",1],["s9","p8",1],["u13","s8",1],
["u13","s6",0],["u14","s6",1],["u14","s4",0],["u14","s8",0],
["u15","s5",1],["u1","s9",0],["u16","s5",1],["u16","s8",0],
["p9","o3",1],["p9","o4",0],["s10","p9",1],["s5","p9",0],
["u17","s5",1],["u17","s10",0],["u13","s10",0],["u5","s10",0],
["u16","s10",0],["u18","s4",1],["u19","s7",1],["u19","s1",0],
["u20","s2",1],["u20","s7",0],["u21","s8",1],["u21","s1",0],
["u22","s2",1],["u22","s3",0],["p10","o2",1],["s11","p10",1],
["u23","s11",1],["u4","s11",0],["u24","s4",1],["u24","s10",0],
["u24","s11",0],["s12","p8",1],["s12","p2",0],["u25","s12",1],
["u27","s9",1],["u28","s9",1],["u28","s4",0],["u29","s1",1],
["u29","s12",0],["u29","s2",0],["s13","p8",1],["f1","s13",1],
["f2","s13",1],["f2","s12",0],["f3","s13",1],["s1","s13",0],["s11","s13",0],
["u2","s2",1],["u12","s2",1],["u12","s9",0],["u11","s3",1],
["u11","s4",0],["u2","s7",0],["u2","s8",0],["u12","s7",0],
["u12","s8",0]
]
};

/* ============================== RENDER ================================== */
(function(){
var gr=document.getElementById("gr"),svg=document.getElementById("lk"),dt=document.getElementById("dt");
var T={},up={},dn={},nd={},pin=null;

DATA.nodes.forEach(function(n){T[n.id]=n});
DATA.links.forEach(function(e){(up[e[0]]=up[e[0]]||[]).push(e[1]);(dn[e[1]]=dn[e[1]]||[]).push(e[0])});

document.getElementById("ttl").textContent=DATA.version;
document.title="WorkFlow map — "+DATA.version;
var shared=DATA.nodes.filter(function(n){return(up[n.id]||[]).length>1}).length;
document.getElementById("mta").textContent=[DATA.note,DATA.nodes.length+" items",DATA.links.length+" links",shared+" serve more than one parent"].filter(Boolean).join("  ·  ");

var lg=document.getElementById("lgd"),h="";
DATA.layers.forEach(function(l){h+='<span class="kk '+l.tone+'">'+l.name.replace(/s$/,"")+"</span>"});
h+='<span class="sp"></span><span>Solid line: home parent</span><span class="sp"></span><span>Dashed: also serves</span><span class="sp"></span><span>Badge: number of parents</span><span class="sp"></span><span>Hover to trace, click to pin, Esc to clear</span>';
lg.innerHTML=h;

gr.style.gridTemplateColumns="repeat("+DATA.layers.length+",minmax(0,200px))";
DATA.layers.forEach(function(l){
var c=document.createElement("div");c.className="col";
var ch=document.createElement("div");ch.className="ch";ch.textContent=l.name;c.appendChild(ch);
DATA.nodes.filter(function(n){return n.layer===l.key}).forEach(function(n){
var p=(up[n.id]||[]).length,b=document.createElement("button");
b.type="button";b.className="nd "+l.tone+(p>1?" b":"");b.dataset.id=n.id;b.textContent=n.short;
if(p>1){var s=document.createElement("span");s.className="bg";s.textContent=p;b.appendChild(s)}
c.appendChild(b);nd[n.id]=b});
gr.appendChild(c)});

var DEF='<span class="st">'+DATA.nodes.length+" items, "+DATA.links.length+' links. <b>'+shared+" of them serve more than one parent</b> and carry a badge. Each idea is written once and reused, never duplicated.</span>";

var PATH={};

function draw(){
var gb=gr.getBoundingClientRect(),R={};
svg.setAttribute("width",gb.width);svg.setAttribute("height",gb.height);
svg.setAttribute("viewBox","0 0 "+gb.width+" "+gb.height);
Object.keys(nd).forEach(function(k){var r=nd[k].getBoundingClientRect();
R[k]={l:r.left-gb.left,r:r.right-gb.left,h:r.height,c:r.top-gb.top+r.height/2}});

/* spread the links along each node's edge instead of pinching them into one point */
var asP={},asC={},AR={},AL={};
DATA.links.forEach(function(e){(asP[e[1]]=asP[e[1]]||[]).push(e);(asC[e[0]]=asC[e[0]]||[]).push(e)});
function fan(list,node,end,out){
list.sort(function(a,b){return R[a[end]].c-R[b[end]].c});
var n=list.length,span=Math.min(R[node].h-14,(n-1)*9),y0=R[node].c-span/2;
list.forEach(function(e,i){out[e[0]+"|"+e[1]]=n<2?R[node].c:y0+span/(n-1)*i})}
Object.keys(asP).forEach(function(k){fan(asP[k],k,0,AR)});
Object.keys(asC).forEach(function(k){fan(asC[k],k,1,AL)});

var s="";PATH={};
DATA.links.forEach(function(e){
var key=e[0]+"|"+e[1],x1=R[e[1]].r,y1=AR[key],x2=R[e[0]].l,y2=AL[key];
var sb=Math.min(18,(x2-x1)*.22),a=x1+sb,b=x2-sb,m=(b-a)*.5;
var d="M"+x1+" "+y1+"L"+a+" "+y1+"C"+(a+m)+" "+y1+" "+(b-m)+" "+y2+" "+b+" "+y2+"L"+x2+" "+y2;
PATH[key]=d;
s+='<path class="e'+(e[2]?"":" d")+'" d="'+d+'"/>'});
svg.innerHTML='<g>'+s+'</g><g id="hg"></g>'}

function chain(id){var set={};set[id]=1;
(function w(k,m){(m[k]||[]).forEach(function(v){if(!set[v]){set[v]=1;w(v,m)}})})(id,up);
(function w(k,m){(m[k]||[]).forEach(function(v){if(!set[v]){set[v]=1;w(v,m)}})})(id,dn);
return set}

function label(k){var l=DATA.layers.filter(function(x){return x.key===k})[0];return l?l.name.replace(/s$/,""):k}

function info(id){var n=T[id],ps=up[id]||[],cs=dn[id]||[];
var h='<span class="ttl"><b>'+label(n.layer)+"</b> — "+n.full+"</span>";
if(ps.length)h+='<span class="sv">Serves '+ps.length+": "+ps.map(function(x){return T[x].full}).join("  ·  ")+"</span>";
if(cs.length)h+='<span class="sv">Served by '+cs.length+": "+cs.map(function(x){return T[x].full}).join("  ·  ")+"</span>";
return h}

function focus(id){
var hg=document.getElementById("hg");
if(!id){gr.classList.remove("on");dt.innerHTML=DEF;if(hg)hg.innerHTML="";return}
var set=chain(id);gr.classList.add("on");
Object.keys(nd).forEach(function(k){nd[k].classList.toggle("hi",!!set[k])});
/* every casing first, then every line, so highlighted links read clearly where they cross */
var cas="",ln="";
DATA.links.forEach(function(e){
if(!(set[e[0]]&&set[e[1]]))return;
var d=PATH[e[0]+"|"+e[1]];if(!d)return;
cas+='<path class="hc" d="'+d+'"/>';
ln+='<path class="hl'+(e[2]?"":" d")+'" d="'+d+'"/>'});
hg.innerHTML=cas+ln;
dt.innerHTML=info(id)}

Object.keys(nd).forEach(function(k){var b=nd[k];
b.addEventListener("mouseenter",function(){if(!pin)focus(k)});
b.addEventListener("mouseleave",function(){if(!pin)focus(null)});
b.addEventListener("focus",function(){if(!pin)focus(k)});
b.addEventListener("click",function(){
if(pin===k){pin=null;b.classList.remove("pin");focus(null)}
else{if(pin)nd[pin].classList.remove("pin");pin=k;b.classList.add("pin");focus(k)}})});

document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&pin){nd[pin].classList.remove("pin");pin=null;focus(null)}});

dt.innerHTML=DEF;draw();
if(window.ResizeObserver)new ResizeObserver(function(){draw();if(pin)focus(pin)}).observe(gr);
else window.addEventListener("resize",draw);
})();
</script>
</body>
</html>
